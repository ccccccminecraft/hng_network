version: '3.5'

services:
    flask:
        build:
            context: .
            dockerfile: Dockerfile
        environment:
            HNG_SSL_ENABLED: ${HNG_SSL_ENABLED:-false}
            HNG_PORT: ${HNG_PORT:-5000}
            HNG_SSL_CERT_PATH: ${HNG_SSL_CERT_PATH:-./.pem/cert.pem}
            HNG_SSL_KEY_PATH: ${HNG_SSL_KEY_PATH:-./.pem/server_secret.key}
        ports:
            - "${HNG_PORT:-5000}:${HNG_PORT:-5000}"
        volumes:
            - "./flask:/usr/src/app"
        tty: true
        command: "./run.sh"
        stdin_open: true
    redis:
        image: "redis:latest"
        ports:
            - "6379:6379"
        volumes:
            - "./redis:/data"
